# Posts each new GitHub release to CurseForge and Modrinth (datapack + resource pack + NeoForge jar, with their changelogs).
# Secrets: CURSEFORGE_TOKEN, MODRINTH_TOKEN. Config: .github/publish.json. Changelogs: changelogs/<version>/*.md
name: Publish to CurseForge and Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.4)"
        required: true
      targets:
        description: "Where to publish"
        type: choice
        options: [all, modrinth, curseforge]
        default: all
      channel:
        description: "Version type (empty = .github/publish.json)"
        type: choice
        options: ["", release, beta, alpha]
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release files
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --pattern "*.jar" --dir dist
      - name: Upload
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MR_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          TARGETS: ${{ inputs.targets || 'all' }}
          CHANNEL: ${{ inputs.channel }}
        run: bash .github/scripts/publish.sh
